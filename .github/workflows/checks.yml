# Перевірки для кожного PR і для main: GitHub Pages публікує main одразу, тож помилка має зупинитися тут.
name: Перевірки

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Зібраний модуль і мітки версій відповідають коду (pnpm build)
        run: |
          pnpm build
          git diff --exit-code -- proofreading-worker.js index.html vendor || { echo "::error::Запустіть pnpm build і закомітьте результат."; exit 1; }
      - run: pnpm test
